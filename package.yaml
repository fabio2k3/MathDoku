#===============================================================================
# MATHDOKU: MATHEMATICAL SUDOKU IN HASKELL
#===============================================================================
name:                MathDoku
version:             1.0.0.0
github:              "fabio2k3/MathDoku"
license:             MIT
author:              "Your team"
maintainer:          "you@team.com"
copyright:           "2025"

synopsis:            Interactive mathematical sudoku with hints
category:            Game

extra-source-files:
  - README.md
  - LICENSE

dependencies:
  - base >= 4.12 && < 4.15    # GHC 8.10.7 compatible
  - containers
  - mtl
  - random
  - MonadRandom
  - gloss >= 1.13 && < 1.14   # Stable gloss version
  - time
  - text

ghc-options:
  - -Wall
  - -Wcompat
  - -O2

library:
  source-dirs: src
  exposed-modules:
    - MathDoku
    - MathDoku.Core
    - MathDoku.Solver
    - MathDoku.Generator
    - MathDoku.Hints
    - MathDoku.GameState
    - MathDoku.UI
    - MathDoku.UIHints

executables:
  MathDoku-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - MathDoku

  MathDoku-hints-exe:
    main:                Main.hs
    source-dirs:         app/hints
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - MathDoku

tests:
  mathdoku-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - MathDoku
      - hspec
      - QuickCheck
      - hspec-discover
